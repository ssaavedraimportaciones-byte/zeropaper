<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1b2a">
<title>ZeroPaper™ — Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d1b2a;--bg2:#152538;--bg3:#1f3349;
  --fg:#f1f5f9;--fg2:#cbd5e1;--mu:#94a3b8;--brd:rgba(255,255,255,.1);
  --g:#0d7c66;--g1:#10a37f;--g2:#13b48a;
  --b:#2563eb;--b2:#3b82f6;--r:#ef4444;
  --mono:'JetBrains Mono','Courier New',monospace;
  --disp:'Inter',system-ui,-apple-system,sans-serif;
  --radius:16px;--ease:cubic-bezier(.4,0,.2,1);
}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--disp);-webkit-font-smoothing:antialiased;}
body{display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.wrap{width:100%;max-width:400px;animation:fadeUp .4s var(--ease) both;}
.logo{text-align:center;margin-bottom:32px;}
.logo-mark{font-weight:900;font-size:36px;color:var(--g2);letter-spacing:-1.5px;line-height:1;}
.logo-tm{font-size:16px;vertical-align:super;color:var(--mu);}
.logo-sub{font-family:var(--mono);font-size:10px;color:var(--mu);letter-spacing:3px;margin-top:6px;}
.box{background:rgba(255,255,255,.04);border:1px solid var(--brd);border-radius:22px;padding:32px 28px;}
.box-title{font-weight:800;font-size:20px;margin-bottom:4px;}
.box-sub{font-family:var(--mono);font-size:11px;color:var(--mu);letter-spacing:1.5px;margin-bottom:24px;}
.lbl{font-weight:700;font-size:12px;letter-spacing:.5px;color:var(--fg2);display:block;margin-bottom:6px;text-transform:uppercase;}
.inp{width:100%;background:var(--bg3);border:1px solid var(--brd);border-radius:12px;padding:14px 16px;color:var(--fg);font-size:15px;font-family:var(--disp);margin-bottom:14px;transition:border-color .2s;}
.inp:focus{outline:none;border-color:var(--g2);box-shadow:0 0 0 3px rgba(19,180,138,.1);}
.btn{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-weight:700;font-size:15px;font-family:var(--disp);letter-spacing:.3px;cursor:pointer;transition:all .2s var(--ease);box-shadow:0 4px 16px rgba(19,180,138,.2);}
.btn:active{transform:scale(.97);}
.err{color:var(--r);font-size:12px;font-family:var(--mono);min-height:18px;margin-bottom:10px;text-align:center;}
.divider{height:1px;background:var(--brd);margin:20px 0;}
.demo-title{font-family:var(--mono);font-size:10px;color:var(--mu);letter-spacing:2px;margin-bottom:12px;text-align:center;}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.demo-btn{padding:10px 12px;border:1px solid var(--brd);border-radius:12px;background:rgba(255,255,255,.03);cursor:pointer;text-align:left;transition:all .2s var(--ease);}
.demo-btn:hover{border-color:var(--g2);background:rgba(19,180,138,.06);}
.demo-btn:active{transform:scale(.97);}
.demo-role{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:1px;margin-bottom:3px;}
.demo-email{font-size:10px;color:var(--mu);}
.role-owner{color:#f59e0b;}
.role-jefatura{color:var(--b2);}
.role-operador{color:var(--g2);}
.role-usuario{color:var(--mu);}
.loading{display:none;text-align:center;font-family:var(--mono);font-size:11px;color:var(--mu);margin-top:10px;letter-spacing:1px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-mark">ZeroPaper<span class="logo-tm">™</span></div>
    <div class="logo-sub">GESTIÓN PORTUARIA DIGITAL</div>
  </div>
  <div class="box">
    <div class="box-title">Iniciar sesión</div>
    <div class="box-sub">SELECCIONA TU ACCESO</div>
    <div class="err" id="loginErr"></div>
    <label class="lbl">Correo electrónico</label>
    <input class="inp" id="loginEmail" type="email" placeholder="correo@empresa.cl" autocomplete="email">
    <label class="lbl">Contraseña</label>
    <input class="inp" id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="loginBtn" onclick="doLogin()">Ingresar al sistema →</button>
    <div class="loading" id="loadingMsg">⏳ Verificando credenciales...</div>

    <div class="divider"></div>
    <div class="demo-title">ACCESO RÁPIDO — DEMO</div>
    <div class="demo-grid">
      <div class="demo-btn" onclick="loginDemo('propietario@zeropaper.cl','Owner2026!')">
        <div class="demo-role role-owner">👑 OWNER</div>
        <div class="demo-email">propietario@zeropaper.cl</div>
      </div>
      <div class="demo-btn" onclick="loginDemo('jefatura@demo.cl','Jefe2026!')">
        <div class="demo-role role-jefatura">🏢 JEFATURA</div>
        <div class="demo-email">jefatura@demo.cl</div>
      </div>
      <div class="demo-btn" onclick="loginDemo('operador@demo.cl','Oper2026!')">
        <div class="demo-role role-operador">⚙ OPERADOR</div>
        <div class="demo-email">operador@demo.cl</div>
      </div>
      <div class="demo-btn" onclick="loginDemo('usuario@demo.cl','User2026!')">
        <div class="demo-role role-usuario">👤 USUARIO</div>
        <div class="demo-email">usuario@demo.cl</div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

// ── FIREBASE CONFIG ──
const FB = { projectId:'zeropaper-prod', apiKey:'AIzaSyCli7F4hLi-XEmmekGZpO2KQ1SO612I85Y' };
const FS_BASE = `https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents`;
const K_SESSION = 'zp_unified_session';

// ── DEMO USERS (hardcoded) ──
const DEMO_USERS = {
  'propietario@zeropaper.cl': { pass:'Owner2026!', role:'owner',    name:'Propietario ZeroPaper', company:'ZeroPaper™' },
  'jefatura@demo.cl':         { pass:'Jefe2026!',  role:'jefatura', name:'Jefatura Demo',         company:'Demo Terminal S.A.' },
  'operador@demo.cl':         { pass:'Oper2026!',  role:'operador', name:'Operador Demo',          company:'Demo Terminal S.A.' },
  'usuario@demo.cl':          { pass:'User2026!',  role:'usuario',  name:'Usuario Demo',           company:'Demo Terminal S.A.' },
};

// ── ROLE → REDIRECT ──
const ROLE_REDIRECT = {
  owner:    '/owner',
  jefatura: '/negocio',
  admin:    '/negocio',
  operador: '/app',
  usuario:  '/certificado',
};

// ── SHA-256 ──
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function emailToUid(email) {
  return email.toLowerCase().replace(/[^a-z0-9]/g,'_').slice(0,40);
}

// ── SESSION ──
function saveSession(data) {
  sessionStorage.setItem(K_SESSION, JSON.stringify(data));
}
function redirect(role) {
  window.location.href = ROLE_REDIRECT[role] || '/app';
}

// ── CHECK IF ALREADY LOGGED IN ──
(function() {
  try {
    const s = JSON.parse(sessionStorage.getItem(K_SESSION) || 'null');
    if (s?.role && s?.email) { redirect(s.role); }
  } catch {}
})();

// ── DEMO LOGIN ──
function loginDemo(email, pass) {
  document.getElementById('loginEmail').value = email;
  document.getElementById('loginPass').value  = pass;
  doLogin();
}

// ── MAIN LOGIN ──
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass  = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  const btn   = document.getElementById('loginBtn');
  const load  = document.getElementById('loadingMsg');
  errEl.textContent = '';

  if (!email || !pass) { errEl.textContent = 'Ingresa correo y contraseña'; return; }

  btn.disabled = true;
  load.style.display = 'block';

  try {
    // 1. Verificar demo users primero
    const demo = DEMO_USERS[email];
    if (demo && demo.pass === pass) {
      saveSession({ email, role: demo.role, name: demo.name, company: demo.company, demo: true });
      redirect(demo.role);
      return;
    }

    // 2. Verificar en Firestore (usuarios reales)
    const uid  = emailToUid(email);
    const hash = await sha256(email + '::' + pass);
    const res  = await fetch(`${FS_BASE}/usuarios/${uid}?key=${FB.apiKey}`);
    if (!res.ok) { errEl.textContent = 'Correo o contraseña incorrectos'; return; }
    const doc    = await res.json();
    const fields = doc.fields || {};
    const stored = (k) => fields[k]?.stringValue || '';

    if (!stored('passHash') || stored('passHash') !== hash) {
      errEl.textContent = 'Correo o contraseña incorrectos';
      return;
    }

    const rolRaw = stored('rol') || 'operador';
    const role   = ROLE_REDIRECT[rolRaw] ? rolRaw : 'operador';
    saveSession({
      email,
      role,
      name:    stored('nombre') || email.split('@')[0],
      company: stored('empresaNombre') || '',
      uid,
      empresaId: stored('empresaId') || '',
    });
    redirect(role);
  } catch(e) {
    errEl.textContent = 'Error de conexión. Intenta nuevamente.';
  } finally {
    btn.disabled = false;
    load.style.display = 'none';
  }
}

// ── ENTER KEY ──
document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('loginEmail').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('loginPass').focus(); });
</script>
</body>
</html>
