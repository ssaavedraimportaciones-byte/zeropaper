<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZeroPaper™ — Dashboard TV</title>
<meta name="theme-color" content="#061a0a">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#040a06;--bg2:#081009;--bg3:#0d1810;--g:#22c55e;--g2:#4ade80;--mu:#4a6b50;--brd:rgba(34,197,94,.12);--red:#ef4444;--amber:#f59e0b;--cyan:#00d4ff;--disp:'Bebas Neue',sans-serif;--body:'Outfit',sans-serif;--mono:'Space Mono',monospace}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#e8f5ea;font-family:var(--body)}
body{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 1fr 1fr;gap:1px;background:rgba(34,197,94,.08)}

/* TOPBAR */
#topbar{grid-column:1/-1;background:var(--bg2);border-bottom:1px solid var(--brd);padding:12px 28px;display:flex;align-items:center;justify-content:space-between}
.tb-logo{font-family:var(--disp);font-size:1.6rem;letter-spacing:4px;color:var(--g)}
.tb-right{display:flex;align-items:center;gap:2rem}
.tb-clock{font-family:var(--disp);font-size:2rem;letter-spacing:3px;color:var(--g)}
.tb-date{font-family:var(--mono);font-size:.7rem;color:var(--mu);letter-spacing:2px;text-align:right}
.tb-badge{font-family:var(--mono);font-size:.65rem;letter-spacing:2px;color:var(--mu);background:rgba(34,197,94,.08);border:1px solid var(--brd);border-radius:20px;padding:4px 12px}

/* PANELS */
.panel{background:var(--bg2);padding:20px 24px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.panel-label{font-family:var(--mono);font-size:.62rem;color:var(--mu);letter-spacing:3px;display:flex;align-items:center;gap:.6rem}
.panel-label::before{content:'';width:1.5rem;height:1px;background:var(--g)}

/* KPIs */
#kpis{grid-column:1/-1;background:var(--bg);padding:16px 20px;display:grid;grid-template-columns:repeat(5,1fr);gap:1px}
.kpi{background:var(--bg2);padding:18px 20px;text-align:center;border-bottom:3px solid transparent;transition:border-color .3s}
.kpi.ok{border-color:var(--g)}
.kpi.warn{border-color:var(--amber)}
.kpi.alert{border-color:var(--red)}
.kpi-num{font-family:var(--disp);font-size:3rem;letter-spacing:2px;line-height:1}
.kpi-lbl{font-family:var(--mono);font-size:.6rem;color:var(--mu);letter-spacing:2px;margin-top:6px}
.kpi.ok .kpi-num{color:var(--g)}
.kpi.warn .kpi-num{color:var(--amber)}
.kpi.alert .kpi-num{color:var(--red)}
.kpi.neutral .kpi-num{color:#e8f5ea}

/* FEED */
.feed-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(34,197,94,.06);animation:fadeIn .4s ease}
.feed-item:last-child{border-bottom:none}
.fi-tipo{font-family:var(--mono);font-size:.65rem;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:4px;flex-shrink:0;width:62px;text-align:center}
.fi-in{background:rgba(34,197,94,.15);color:var(--g)}
.fi-out{background:rgba(255,100,0,.12);color:#ff6400}
.fi-plate{font-family:var(--disp);font-size:1.3rem;letter-spacing:2px;color:#e8f5ea;flex-shrink:0;min-width:90px}
.fi-doc{font-family:var(--mono);font-size:.7rem;color:var(--g2);flex:1}
.fi-meta{font-family:var(--mono);font-size:.62rem;color:var(--mu);text-align:right;flex-shrink:0}
.fi-time{font-family:var(--disp);font-size:1rem;color:var(--mu);letter-spacing:1px}

/* VEHÍCULOS DENTRO */
.inside-item{background:rgba(34,197,94,.05);border:1px solid rgba(34,197,94,.15);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.ii-plate{font-family:var(--disp);font-size:1.4rem;letter-spacing:2px;color:var(--g)}
.ii-time{font-family:var(--mono);font-size:.7rem;color:var(--mu)}
.ii-warn{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.06)}
.ii-warn .ii-plate{color:var(--amber)}
.inside-empty{font-family:var(--mono);font-size:.75rem;color:var(--mu);text-align:center;padding:24px;letter-spacing:1px}

/* ALERTAS */
.alert-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.alert-item:last-child{border-bottom:none}
.al-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.al-red{background:var(--red)}
.al-amber{background:var(--amber)}
.al-green{background:var(--g)}
.al-text{font-size:.85rem;line-height:1.5}
.al-sub{font-family:var(--mono);font-size:.65rem;color:var(--mu);margin-top:2px;letter-spacing:.5px}
.no-alerts{font-family:var(--mono);font-size:.75rem;color:var(--g);text-align:center;padding:20px;letter-spacing:1px}

/* TURNO */
.turno-stat{background:rgba(34,197,94,.06);border:1px solid var(--brd);border-radius:8px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.ts-label{font-family:var(--mono);font-size:.65rem;color:var(--mu);letter-spacing:1px}
.ts-val{font-family:var(--disp);font-size:1.4rem;color:var(--g);letter-spacing:1px}

/* BOTTOMBAR */
#bottombar{grid-column:1/-1;background:var(--bg3);border-top:1px solid var(--brd);padding:8px 28px;display:flex;align-items:center;justify-content:space-between}
.bb-left{font-family:var(--mono);font-size:.62rem;color:var(--mu);letter-spacing:2px}
.bb-pulse{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.62rem;color:var(--g);letter-spacing:2px}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--g);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
@keyframes fadeIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

/* DEPTO BAR */
.depto-bar{display:flex;gap:8px;flex-wrap:wrap}
.depto-pill{background:rgba(34,197,94,.08);border:1px solid var(--brd);border-radius:20px;padding:4px 14px;font-family:var(--mono);font-size:.65rem;color:var(--mu);display:flex;gap:8px;align-items:center}
.depto-pill-n{color:var(--g);font-weight:700}

/* RESPONSIVE TV */
@media(max-width:1100px){
  body{grid-template-columns:1fr 1fr}
  #kpis{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <div style="display:flex;align-items:center;gap:16px">
    <div class="tb-logo">ZEROPAPER™</div>
    <div class="tb-badge">DASHBOARD OPERACIONES EN VIVO</div>
  </div>
  <div class="tb-right">
    <div id="empresa-name" style="font-family:var(--mono);font-size:.72rem;color:var(--g);letter-spacing:2px"></div>
    <div style="text-align:right">
      <div class="tb-clock" id="clock">—:—</div>
      <div class="tb-date" id="dateStr">—</div>
    </div>
  </div>
</div>

<!-- KPIs -->
<div id="kpis">
  <div class="kpi ok"><div class="kpi-num" id="kpi-hoy">0</div><div class="kpi-lbl">OPERACIONES HOY</div></div>
  <div class="kpi ok"><div class="kpi-num" id="kpi-ingresos">0</div><div class="kpi-lbl">INGRESOS</div></div>
  <div class="kpi ok"><div class="kpi-num" id="kpi-salidas">0</div><div class="kpi-lbl">SALIDAS</div></div>
  <div class="kpi neutral" id="kpi-dentro-card"><div class="kpi-num" id="kpi-dentro">0</div><div class="kpi-lbl">VEHÍCULOS DENTRO</div></div>
  <div class="kpi ok"><div class="kpi-num" id="kpi-turno">0</div><div class="kpi-lbl">ESTE TURNO</div></div>
</div>

<!-- PANEL: ÚLTIMO MOVIMIENTO -->
<div class="panel" style="grid-row:3">
  <div class="panel-label">ÚLTIMAS OPERACIONES</div>
  <div id="feed" style="display:flex;flex-direction:column;flex:1;overflow:hidden"></div>
</div>

<!-- PANEL: VEHÍCULOS DENTRO -->
<div class="panel" style="grid-row:3">
  <div class="panel-label">VEHÍCULOS EN RECINTO</div>
  <div id="inside-list" style="display:flex;flex-direction:column;gap:8px;flex:1;overflow:hidden"></div>
</div>

<!-- PANEL: ALERTAS + TURNO -->
<div class="panel" style="grid-row:3">
  <div class="panel-label">ALERTAS DEL SISTEMA</div>
  <div id="alerts-list" style="flex:1;overflow:hidden"></div>
  <div class="panel-label" style="margin-top:8px">RESUMEN TURNO</div>
  <div id="turno-stats" style="display:flex;flex-direction:column;gap:8px"></div>
</div>

<!-- BOTTOMBAR -->
<div id="bottombar">
  <div class="bb-left" id="bb-last">Última actualización: —</div>
  <div style="display:flex;gap:2rem;align-items:center">
    <div id="depto-bar" class="depto-bar"></div>
    <div class="bb-pulse"><div class="pulse-dot"></div>EN VIVO</div>
  </div>
</div>

<script>
'use strict';
let db = null;

async function openDB() {
  return new Promise(res => {
    const req = indexedDB.open('zp5_db', 1);
    req.onsuccess  = e => res(e.target.result);
    req.onerror    = () => res(null);
    req.onupgradeneeded = () => {};
  });
}

async function getOps() {
  if (!db) return [];
  return new Promise(res => {
    try {
      const tx = db.transaction('ops','readonly');
      const req = tx.objectStore('ops').getAll();
      req.onsuccess = () => res(req.result || []);
      req.onerror   = () => res([]);
    } catch(e) { res([]); }
  });
}

function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
}
function minutos(ms) { return Math.floor(ms/60000); }
function hhmm(ms) {
  const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

async function refresh() {
  const ops = await getOps();
  const now  = Date.now();
  const hoy  = new Date().toLocaleDateString('es-CL');

  // Detectar empresa activa desde sesión en localStorage
  let empresaId = null, empresaNombre = 'DEMO';
  try {
    const s = JSON.parse(localStorage.getItem('zp5_session')||'{}');
    empresaId    = s.empresaId || null;
    empresaNombre = s.empresaNombre || 'DEMO';
  } catch(e){}
  document.getElementById('empresa-name').textContent = empresaNombre;

  const myOps  = ops.filter(o => !empresaId || o.empresaId === empresaId);
  const todayOps = myOps.filter(o => o.fecha === hoy).sort((a,b)=>b.ts-a.ts);
  const ingresos = todayOps.filter(o=>o.tipo==='INGRESO');
  const salidas  = todayOps.filter(o=>o.tipo==='SALIDA');

  // KPI hoy
  document.getElementById('kpi-hoy').textContent      = todayOps.length;
  document.getElementById('kpi-ingresos').textContent = ingresos.length;
  document.getElementById('kpi-salidas').textContent  = salidas.length;

  // Turno (desde localStorage)
  const turnoInicio = localStorage.getItem('zp5_turno_inicio');
  const turnoTs     = turnoInicio ? new Date(turnoInicio).getTime() : now;
  const turnoOps    = myOps.filter(o => o.ts >= turnoTs);
  document.getElementById('kpi-turno').textContent = turnoOps.length;

  // Vehículos dentro: ingresos sin salida correspondiente hoy
  const placasMap = {};
  todayOps.slice().reverse().forEach(o => {
    if (!placasMap[o.plate]) placasMap[o.plate] = { count:0, lastIn:0 };
    if (o.tipo==='INGRESO') { placasMap[o.plate].count++; placasMap[o.plate].lastIn = o.ts; }
    if (o.tipo==='SALIDA')  { placasMap[o.plate].count = Math.max(0, placasMap[o.plate].count-1); }
  });
  const dentro = Object.entries(placasMap).filter(([,v])=>v.count>0).map(([plate,v])=>({plate,lastIn:v.lastIn}));
  const kpiDentroCard = document.getElementById('kpi-dentro-card');
  document.getElementById('kpi-dentro').textContent = dentro.length;
  kpiDentroCard.className = 'kpi ' + (dentro.some(v=>now-v.lastIn>4*3600000)?'alert':dentro.length>0?'warn':'ok');

  // Feed últimas 8 operaciones
  const feedEl = document.getElementById('feed');
  feedEl.innerHTML = todayOps.slice(0,8).map(o=>`
    <div class="feed-item">
      <span class="fi-tipo ${o.tipo==='INGRESO'?'fi-in':'fi-out'}">${o.tipo==='INGRESO'?'↓ IN':'↑ OUT'}</span>
      <span class="fi-plate">${o.plate||'—'}</span>
      <span class="fi-doc">${(o.docType||'').replace(/_/g,' ')}${o.folio?' · '+o.folio:''}</span>
      <div class="fi-meta"><div class="fi-time">${o.hora||''}</div><div style="font-size:.6rem;color:var(--mu)">${o.operador||''}</div></div>
    </div>`).join('') || '<div class="inside-empty">SIN OPERACIONES HOY</div>';

  // Vehículos dentro
  const insideEl = document.getElementById('inside-list');
  if (!dentro.length) {
    insideEl.innerHTML = '<div class="inside-empty">RECINTO VACÍO</div>';
  } else {
    insideEl.innerHTML = dentro.slice(0,6).map(v=>{
      const mins = minutos(now - v.lastIn);
      const warn = mins > 240;
      return `<div class="inside-item ${warn?'ii-warn':''}">
        <div><div class="ii-plate">${v.plate}</div><div class="ii-time">Ingresó hace ${hhmm(now-v.lastIn)}</div></div>
        ${warn?'<span style="font-size:1.2rem">⚠️</span>':'<span style="font-size:1rem;color:var(--g)">●</span>'}
      </div>`;
    }).join('');
  }

  // Alertas
  const alertsEl = document.getElementById('alerts-list');
  const alertas = [];
  const sinFoto  = todayOps.filter(o=>!o.fotoId&&!(o.fotoIds?.length));
  const lentos   = dentro.filter(v=>now-v.lastIn>4*3600000);
  const folios   = todayOps.filter(o=>!o.folio).length;
  if (lentos.length)   alertas.push({t:'red',  msg:`${lentos.length} vehículo(s) lleva más de 4h en el recinto`,sub:lentos.map(v=>v.plate).join(', ')});
  if (sinFoto.length>2)alertas.push({t:'amber',msg:`${sinFoto.length} operaciones sin foto de documento`,sub:'Ve a Historial para completar'});
  if (folios>3)        alertas.push({t:'amber',msg:`${folios} operaciones sin número de folio registrado`,sub:'Revisar con el operador'});
  if (!alertas.length) alertas.push({t:'green',msg:'Sin alertas activas — todo en orden',sub:''});

  alertsEl.innerHTML = alertas.map(a=>`
    <div class="alert-item">
      <div class="al-dot al-${a.t}"></div>
      <div><div class="al-text">${a.msg}</div>${a.sub?`<div class="al-sub">${a.sub}</div>`:''}</div>
    </div>`).join('');

  // Turno stats
  const turnoEl = document.getElementById('turno-stats');
  const duracion = turnoInicio ? now - new Date(turnoInicio).getTime() : 0;
  const conFoto  = turnoOps.filter(o=>o.fotoId||o.fotoIds?.length).length;
  turnoEl.innerHTML = `
    <div class="turno-stat"><span class="ts-label">DURACIÓN</span><span class="ts-val">${duracion>0?hhmm(duracion):'—'}</span></div>
    <div class="turno-stat"><span class="ts-label">OPERACIONES</span><span class="ts-val">${turnoOps.length}</span></div>
    <div class="turno-stat"><span class="ts-label">CON FOTO</span><span class="ts-val">${conFoto}</span></div>`;

  // Deptos en depto bar
  try {
    const deptos = JSON.parse(localStorage.getItem('zp5_deptos')||'[]');
    const deptoBar = document.getElementById('depto-bar');
    if (deptos.length) {
      deptoBar.innerHTML = deptos.map(d=>{
        const n = myOps.filter(o=>o.fecha===hoy&&o.depto===d.id).length;
        return `<div class="depto-pill">${d.icon} ${d.nombre} <span class="depto-pill-n">${n}</span></div>`;
      }).join('');
    }
  } catch(e){}

  document.getElementById('bb-last').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-CL');
}

function tickClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('dateStr').textContent = now.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();
}

async function init() {
  db = await openDB();
  tickClock();
  setInterval(tickClock, 1000);
  await refresh();
  setInterval(refresh, 5000);

  // Escuchar cambios del app en tiempo real (misma pestaña o BroadcastChannel)
  try {
    const bc = new BroadcastChannel('zp_ops');
    bc.onmessage = () => refresh();
  } catch(e){}
}

init();

// Anti-inspección
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.key==='F12'||(e.ctrlKey&&e.shiftKey&&'IJC'.includes(e.key.toUpperCase()))||(e.ctrlKey&&e.key.toUpperCase()==='U')) e.preventDefault();
});
</script>
</body>
</html>
